<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="icon" href="data:," />
    <title>JoBot</title>
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("sencia-theme") === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0a0b0d;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background: #f5f6f8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading">Carregando JoBot...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
